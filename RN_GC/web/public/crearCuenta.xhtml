<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Crear cuenta - Administración Contable</title>
        <h:outputStylesheet library="css" name="jsfcrudRN.css"/>
    </h:head>
    <h:body>
        <p:growl id="growl" showDetail="true" autoUpdate="true" />

        <div align="center" style="max-width: 500px; margin: 60px auto; text-align: left;">
            <h2 style="text-align:center;">Crear cuenta nueva</h2>
            <h:form enctype="multipart/form-data">
                <p:outputLabel value="Tipo de cuenta:" />
                <p:selectOneMenu value="#{registroPublicoController.tipoCuenta}" style="width:100%;">
                    <f:selectItem itemLabel="Selecciona..." itemValue="" noSelectionOption="true"/>
                    <f:selectItem itemLabel="Despacho" itemValue="DESPACHO"/>
                    <f:selectItem itemLabel="Contribuyente" itemValue="CONTRIBUYENTE"/>
                </p:selectOneMenu>
                <br/><br/>
                <p:outputLabel value="RFC:" />
                <p:inputText value="#{registroPublicoController.rfc}" style="width:100%;" />
                <br/><br/>
                <p:commandButton value="Verificar RFC" action="#{registroPublicoController.validarRfc()}" update="growl @form" style="width:100%;"/>

                <p:panel rendered="#{registroPublicoController.rfcValidado}" style="margin-top:20px;">
                    <p:outputLabel value="Nombre completo / Razón social:" />
                    <p:inputText value="#{registroPublicoController.nombreCompleto}" style="width:100%;" />
                    <br/><br/>

                    <p:outputLabel value="Correo electrónico:" />
                    <p:inputText value="#{registroPublicoController.email}" style="width:100%;" />
                    <br/><br/>

                    <p:outputLabel value="Contraseña:" />
                    <p:password value="#{registroPublicoController.password}" style="width:100%;" />
                    <br/><br/>

                    <p:outputLabel value="Confirma tu contraseña:" />
                    <p:password value="#{registroPublicoController.confirmarPassword}" style="width:100%;" />
                    <br/><br/>

                    <p:outputLabel value="Código Postal:" />
                    <p:inputNumber value="#{registroPublicoController.codigoPostal}" style="width:100%;" />
                    <br/><br/>

                    <h3>Certificado (CSD o e.firma) #{'DESPACHO' eq registroPublicoController.tipoCuenta ? '- opcional' : '- obligatorio'}</h3>
                    <p:outputLabel value="Archivo .cer:" />
                    <p:fileUpload mode="simple" skinSimple="true" value="#{registroPublicoController.certificadoCer}" label="Elegir .cer"/>
                    <br/><br/>
                    <p:outputLabel value="Archivo .key:" />
                    <p:fileUpload mode="simple" skinSimple="true" value="#{registroPublicoController.certificadoKey}" label="Elegir .key"/>
                    <br/><br/>
                    <p:outputLabel value="Contraseña de la llave privada:" />
                    <p:password value="#{registroPublicoController.certificadoPassword}" style="width:100%;" />
                    <br/><br/>
                    <p:panel rendered="#{'DESPACHO' eq registroPublicoController.tipoCuenta}" style="margin-top:20px;">
                    <h3>Logo de tu despacho (opcional)</h3>
                    <p:fileUpload mode="simple" skinSimple="true" value="#{registroPublicoController.logoDespacho}" label="Elegir imagen"/>
                    </p:panel>
                    <p:commandButton value="Crear cuenta" ajax="false" action="#{registroPublicoController.crearCuenta()}" style="width:100%;"/>
                </p:panel>
                <br/><br/>
                <h:link outcome="/login.xhtml" value="Regresar a Ingresar" />
            </h:form>
        </div>
    </h:body>
</html>
