<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui">

    <p:dialog id="rnGcPeriodoContableTblCreateDlg"
              widgetVar="rnGcPeriodoContableTblCreateDialog"
              header="Inicio de periodo contable"
              modal="true"
              closable="true"
              resizable="false"
              appendTo="@(body)">

        <h:form id="rnGcPeriodoContableTblCreateForm">

            <p:messages id="messages"
                        showDetail="true"
                        closable="true"/>

            <h:panelGroup id="display"
                          layout="block">

                <p:panelGrid columns="2"
                             rendered="#{rnGcPeriodoContableTblController.selected ne null}">

                    <p:outputLabel for="fechaInicio"
                                   value="Fecha de inicio"/>

                    <p:calendar id="fechaInicio"
                                value="#{rnGcPeriodoContableTblController.selected.fechaInicioPeriodo}"
                                pattern="dd/MM/yyyy"
                                showOn="button"
                                required="true"
                                requiredMessage="La fecha inicial es obligatoria"/>

                    <p:outputLabel for="fechaFin"
                                   value="Fecha de fin"/>

                    <p:calendar id="fechaFin"
                                value="#{rnGcPeriodoContableTblController.selected.fechaFinPeriodo}"
                                pattern="dd/MM/yyyy"
                                showOn="button"
                                required="true"
                                requiredMessage="La fecha final es obligatoria"/>

                </p:panelGrid>

                <p:commandButton value="Guardar"
                                 icon="ui-icon-disk"
                                 actionListener="#{rnGcPeriodoContableTblController.create}"
                                 process="@form"
                                 update="@form
                                         :rnGcPeriodoContableTblListForm:datalist
                                         :growl"
                                 oncomplete="if (!args.validationFailed) {
                                     PF('rnGcPeriodoContableTblCreateDialog').hide();
                                 }"/>

                <p:commandButton value="Cancelar"
                                 icon="ui-icon-close"
                                 type="button"
                                 onclick="PF('rnGcPeriodoContableTblCreateDialog').hide();"/>

            </h:panelGroup>

        </h:form>

    </p:dialog>

</ui:composition>
