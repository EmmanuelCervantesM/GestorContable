<?xml version="1.0" encoding="UTF-8" ?>
<!--
    CTR-12: aviso al registrar un cliente o proveedor cuyo RFC está en listas negras.
    Avisa y no bloquea (regla v2.34): el registro ya quedó guardado.
    Parámetro (ui:param): coincidencias  lista de CoincidenciaListaNegra
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

    <p:dialog id="AlertaListaNegraDlg" widgetVar="AlertaListaNegraDialog" modal="true" resizable="false"
              appendTo="@(body)" header="Atención: RFC en listas negras" width="900">
        <h:form id="AlertaListaNegraForm">
            <p:outputPanel>
                <p style="margin-top:0">
                    El RFC que acaba de registrar aparece en las listas negras del SAT. El registro sí se guardó;
                    revise la situación antes de operar con este contribuyente.
                </p>
                <ui:include src="/serv/rnGcListaNegraTbl/SemaforoListaNegra.xhtml">
                    <ui:param name="coincidencias" value="#{coincidencias}"/>
                    <ui:param name="mostrarPersona" value="#{false}"/>
                </ui:include>
                <p:commandButton value="Entendido" type="button" onclick="PF('AlertaListaNegraDialog').hide()" style="margin-top:10px"/>
            </p:outputPanel>
        </h:form>
    </p:dialog>
</ui:composition>
