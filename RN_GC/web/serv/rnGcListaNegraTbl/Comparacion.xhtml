<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
          
    <ui:composition template="/templateRN.xhtml">
        
        <ui:define name="title">
            <h:outputText value="#{bundle.ListRnGcListaNegraTblTitle}"></h:outputText>
        </ui:define>
        
        <ui:define name="body">
            <f:event type="preRenderView" listener="#{rnGcListaNegraTblController.alEntrarComparacion}"/>
            <h:form id="RnGcListaNegraTblListFormAuto">
                <p:panel header="#{bundle.ListRnGcListaNegraTblTitle} Búsqueda Manual" collapsed="true" toggleable="true">
                    <p:dataTable id="datalist" value="#{rnGcListaNegraTblController.busqeudaManual}" var="item"
                                 selectionMode="single" selection="#{rnGcListaNegraTblController.selectedManual}"
                                 paginator="true"  scrollable="true"
                                 rowKey="#{item.id}"
                                 rows="10" resizableColumns="true"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >
                        
                        <p:column filterBy="#{item.nombreContribuyente}" filterMatchMode="contains">
                            <f:facet name="header">
                                <h:outputText value="Nombre"/>
                            </f:facet>
                            <h:outputText value="#{item.nombreContribuyente}" />
                        </p:column>
                        <p:column filterBy="#{item.rfc}" filterMatchMode="contains">
                            <f:facet name="header">
                                <h:outputText value="RFC"/>
                            </f:facet>
                            <h:outputText value="#{item.rfc}" />
                        </p:column>
                        <p:column filterBy="#{item.idTipoLista.tipoLista}" filterMatchMode="contains">
                            <f:facet name="header">
                                <h:outputText value="Tipo Lista"/>
                            </f:facet>
                            <h:outputText value="#{item.idTipoLista.tipoLista}" />
                        </p:column>
                        <p:column filterBy="#{item.idTipoLista.fechaPublicacion}" filterMatchMode="contains">
                            <f:facet name="header">
                                <h:outputText value="Fecha Publicacion"/>
                            </f:facet>
                            <h:outputText value="#{item.idTipoLista.fechaPublicacion}" >
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>
                        <p:column filterBy="#{item.idTipoLista.folioPublicacion}" filterMatchMode="contains">
                            <f:facet name="header">
                                <h:outputText value="Tipo Lista"/>
                            </f:facet>
                            <h:outputText value="#{item.idTipoLista.folioPublicacion}" />
                        </p:column>
                    
                        <f:facet name="header">
                            <p:outputLabel value="Búsqueda por RFC: "/>
                            <p:inputText value="#{rnGcListaNegraTblController.rfc}" style="width: 150px"/>
                            <p:outputLabel value="Búsqueda por Nombre: "/>
                            <p:inputText value="#{rnGcListaNegraTblController.nombre}" style="width: 450px"/>
                            <p:commandButton value="Buscar" icon="ui-icon-search" update="RnGcListaNegraTblListFormAuto:datalist" actionListener="#{rnGcListaNegraTblController.busqueda()}"/>
                        </f:facet>
                    
                    </p:dataTable>
                </p:panel>
            </h:form>
            <p:separator/>
            <h:form id="AvisosListaNegraForm">
                <p:panel header="Avisos de listas negras" rendered="#{not empty rnGcListaNegraTblController.avisos}">
                    <p:dataTable value="#{rnGcListaNegraTblController.avisos}" var="a" rows="10" paginator="true" paginatorAlwaysVisible="false">
                        <p:column headerText="Fecha" style="width:140px">
                            <h:outputText value="#{a.fechaAviso}"><f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/Mexico_City"/></h:outputText>
                        </p:column>
                        <p:column headerText="Cliente / proveedor">
                            <h:outputText value="#{a.nombre}"/>
                        </p:column>
                        <p:column headerText="RFC" style="width:130px">
                            <h:outputText value="#{a.rfc}"/>
                        </p:column>
                        <p:column headerText="Lista" style="width:90px">
                            <h:outputText value="#{a.tipoLista}"/>
                        </p:column>
                        <p:column headerText="Cambio">
                            <h:outputText value="Entró a la lista: " rendered="#{empty a.estadoAnterior}"/>
                            <h:panelGroup rendered="#{not empty a.estadoAnterior}">
                                <span class="ln-semaforo ln-#{rnGcListaNegraTblController.colorDe(a.estadoAnterior)}"></span>
                                <h:outputText value="#{a.estadoAnterior} → "/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{not empty a.estadoNuevo}">
                                <span class="ln-semaforo ln-#{rnGcListaNegraTblController.colorDe(a.estadoNuevo)}"></span>
                                <h:outputText value="#{a.estadoNuevo}" style="font-weight:bold"/>
                            </h:panelGroup>
                            <h:outputText value="Ya no aparece en el listado del SAT" rendered="#{empty a.estadoNuevo}" style="font-weight:bold"/>
                        </p:column>
                    </p:dataTable>
                    <p:commandButton value="Marcar como vistos" icon="ui-icon-check" actionListener="#{rnGcListaNegraTblController.marcarAvisosVistos}"
                                     update="@form" style="margin-top:8px"/>
                </p:panel>
            </h:form>
            <h:form id="RnGcListaNegraTblListForm">
                <p:panel header="#{bundle.ListRnGcListaNegraTblTitle} Búsqueda Automática (mis clientes y proveedores)">
                    <p:commandButton value="Actualizar" icon="ui-icon-refresh" actionListener="#{rnGcListaNegraTblController.refrescarCoincidencias}"
                                     update="@form :AvisosListaNegraForm" style="margin-bottom:8px"/>
                    <ui:include src="/serv/rnGcListaNegraTbl/SemaforoListaNegra.xhtml">
                        <ui:param name="coincidencias" value="#{rnGcListaNegraTblController.coincidenciasUsuario}"/>
                        <ui:param name="mostrarPersona" value="#{true}"/>
                    </ui:include>
                </p:panel>
            </h:form>
        </ui:define>
        
    </ui:composition>
</html>
