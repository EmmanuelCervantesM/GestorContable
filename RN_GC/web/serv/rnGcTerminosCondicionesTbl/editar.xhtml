<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/templateRN.xhtml">
        <ui:define name="title">
            <h:outputText value="Terminos y Condiciones"/>
        </ui:define>
        <ui:define name="body">
            <f:metadata>
                <f:viewAction action="#{rnGcTerminosCondicionesTblController.cargarVigente()}" />
            </f:metadata>

            <h:form rendered="#{rnGcTerminosCondicionesTblController.esAdministrador}">
                <p:panel header="Publicar nueva version de Terminos y Condiciones">
                    <p:growl id="msgTerminos" showDetail="true" autoUpdate="true"/>
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Version:" for="version"/>
                        <p:inputText id="version" value="#{rnGcTerminosCondicionesTblController.version}" placeholder="ej. 1.1"/>
                    </h:panelGrid>

                    <p:outputLabel value="Contenido:" style="font-weight:bold; display:block; margin-top:10px;"/>
                    <p:inputTextarea value="#{rnGcTerminosCondicionesTblController.contenido}" rows="20" style="width:100%;" autoResize="false"/>

                    <br/>
                    <p:commandButton value="Publicar nueva version" action="#{rnGcTerminosCondicionesTblController.publicarNuevaVersion()}" />
                </p:panel>
            </h:form>
            <h:outputText value="No tienes permisos para ver esta pagina." rendered="#{!rnGcTerminosCondicionesTblController.esAdministrador}"/>
        </ui:define>
    </ui:composition>
</html>
