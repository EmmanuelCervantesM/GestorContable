<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
                      "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/templateRN.xhtml">

        <ui:define name="title">
            <h:outputText value="#{bundle.ListRnGcPolizaHeaderTblTitle}" />
        </ui:define>

        <ui:define name="body">

            <!-- FORMULARIO PRINCIPAL DE LA TABLA -->
            <h:form id="RnGcPolizaHeaderTblListForm">

                <p:panel header="#{bundle.ListRnGcPolizaHeaderTblTitle}">

                    <p:dataTable id="datalist"
                                 value="#{rnGcPolizaHeaderTblController.listaPolizasPorUsuario}"
                                 var="item"
                                 selectionMode="single"
                                 selection="#{rnGcPolizaHeaderTblController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 rowStyleClass="#{item.estatus == 'C' ? 'cancelado' : null}">

                        <p:ajax event="rowSelect"
                                update="createButton editButton"/>

                        <p:ajax event="rowUnselect"
                                update="createButton editButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListRnGcPolizaHeaderTblTitle_numeroPoliza}"/>
                            </f:facet>
                            <h:outputText value="#{item.numeroPoliza}"/>
                        </p:column>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListRnGcPolizaHeaderTblTitle_tipoPoliza}"/>
                            </f:facet>
                            <h:outputText value="#{item.tipoPolizaId.tipoPoliza} - #{item.tipoPolizaId.descripcion}"/>
                        </p:column>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListRnGcPolizaHeaderTblTitle_fecha}"/>
                            </f:facet>
                            <h:outputText value="#{item.fecha}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListRnGcPolizaHeaderTblTitle_concepto}"/>
                            </f:facet>
                            <h:outputText value="#{item.concepto}"/>
                        </p:column>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Periodo"/>
                            </f:facet>
                            <h:outputText value="#{item.periodoId.mes} #{item.periodoId.anio}"/>
                        </p:column>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Estatus / Detalle"/>
                            </f:facet>

                            <p:selectOneMenu id="estado"
                                             value="#{item.estatus}"
                                             disabled="true">
                                <f:selectItem itemLabel="Vigente" itemValue="V"/>
                                <f:selectItem itemLabel="Cancelado" itemValue="C"/>
                            </p:selectOneMenu>

                            <p:commandButton value="Detalle"
                                             icon="ui-icon-search"
                                             style="margin-left:5px"
                                             process="@this"
                                             update=":RnGcPolizaDetalleForm:detallePanel"
                                             actionListener="#{rnGcPolizaHeaderTblController.prepararDetalle(item)}"
                                             oncomplete="PF('RnGcPolizaDetalleDialog').show()"/>
                        </p:column>

                        <f:facet name="footer">

                            <p:commandButton id="createButton"
                                             icon="ui-icon-plus"
                                             value="#{bundle.Create}"
                                             process="@this"
                                             actionListener="#{rnGcPolizaHeaderTblController.prepareCreate}"
                                             update=":RnGcPolizaHeaderTblCreateForm"
                                             oncomplete="PF('RnGcPolizaHeaderTblCreateDialog').show()"/>

                            <p:commandButton id="editButton"
                                             icon="ui-icon-pencil"
                                             value="#{bundle.Edit}"
                                             process="@this"
                                             actionListener="#{rnGcPolizaHeaderTblController.prepareEdit}"
                                             update=":RnGcPolizaHeaderTblEditForm :form4:polizaLineasEdittable2"
                                             oncomplete="PF('RnGcPolizaHeaderTblEditDialog').show()"
                                             disabled="#{empty rnGcPolizaHeaderTblController.selected}"/>

                        </f:facet>

                    </p:dataTable>

                </p:panel>

            </h:form>


            <!-- INCLUDES DE CREAR Y EDITAR -->
            <!-- IMPORTANTE: Create.xhtml y Edit.xhtml deben tener su propio h:form interno -->
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>


            <!-- DIÁLOGO DE DETALLE -->
            <p:dialog id="detalleDialog"
                      widgetVar="RnGcPolizaDetalleDialog"
                      modal="true"
                      appendTo="@(body)"
                      header="Detalle de póliza"
                      resizable="false"
                      closable="true">

                <h:form id="RnGcPolizaDetalleForm">

                    <p:outputPanel id="detallePanel">

                        <h:panelGrid columns="2"
                                     cellpadding="5"
                                     rendered="#{not empty rnGcPolizaHeaderTblController.polizaDetalle}">

                            <h:outputText value="Número:" />
                            <h:outputText value="#{rnGcPolizaHeaderTblController.polizaDetalle.numeroPoliza}" />

                            <h:outputText value="Tipo póliza:" />
                            <h:outputText value="#{rnGcPolizaHeaderTblController.polizaDetalle.tipoPolizaId.tipoPoliza} - #{rnGcPolizaHeaderTblController.polizaDetalle.tipoPolizaId.descripcion}" />

                            <h:outputText value="Fecha:" />
                            <h:outputText value="#{rnGcPolizaHeaderTblController.polizaDetalle.fecha}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>

                            <h:outputText value="Concepto:" />
                            <h:outputText value="#{rnGcPolizaHeaderTblController.polizaDetalle.concepto}" />

                            <h:outputText value="Periodo:" />
                            <h:outputText value="#{rnGcPolizaHeaderTblController.polizaDetalle.periodoId.mes} #{rnGcPolizaHeaderTblController.polizaDetalle.periodoId.anio}" />

                        </h:panelGrid>

                        <h:panelGroup rendered="#{empty rnGcPolizaHeaderTblController.polizaDetalle}">
                            <h:outputText value="No hay detalle seleccionado."/>
                        </h:panelGroup>

                    </p:outputPanel>

                    <p:separator/>

                    <p:commandButton value="Cerrar"
                                     type="button"
                                     icon="ui-icon-close"
                                     onclick="PF('RnGcPolizaDetalleDialog').hide()"/>

                </h:form>

            </p:dialog>

        </ui:define>

    </ui:composition>

</html>
