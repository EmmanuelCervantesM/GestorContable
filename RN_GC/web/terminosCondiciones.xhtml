<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Términos y Aviso de Privacidad</title>
        <h:outputStylesheet library="css" name="jsfcrudRN.css"/>
    </h:head>

    <h:body>
        <!-- Al cargar la página se consulta cuál es la versión vigente de cada documento -->
        <f:metadata>
            <f:viewAction action="#{login.prepararTerminos()}" />
        </f:metadata>
        <p:growl id="growl" showDetail="true" />
        <div align="center" style="max-width: 800px; margin: 30px auto;">
            <h2>Términos y Condiciones (versión #{login.versionTerminosVigente})</h2>
            <p:media value="#{rnGcDocumentosLegalesTblController.verDocumento('TERMINOS')}"
                     type="application/pdf" width="100%" height="300"/>
            <h2>Aviso de Privacidad (versión #{login.versionPrivacidadVigente})</h2>
            <p:media value="#{rnGcDocumentosLegalesTblController.verDocumento('PRIVACIDAD')}"
                     type="application/pdf" width="100%" height="300"/>
            <br/>
            <h:form>
                <p:commandButton value="Aceptar" action="#{login.aceptarTerminos()}" accesskey="A" style="margin-right:15px" />
                <p:commandButton value="Rechazar" action="#{login.rechazarTerminos()}" accesskey="R" />
            </h:form>
        </div>
    </h:body>
</html>
