<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/templateRN.xhtml">

        <ui:define name="title">
            Administración Contable
        </ui:define>

        <ui:define name="body">
            <br />
            <div align="center" style="vertical-align: middle;" height="300" width="300">
                <h:form>
                    <p:graphicImage id="graficosImagen" value="#{rnGcImagenesTblController.byteToImage(facturarContoller.obtenerRFCUsuario())}" width="250" height="250" cache="false"/>
                </h:form>
            </div>

            <!-- CTR-03 (v2.27): banner de timbres bajos / certificados por vencer.
                 Se recalcula en vivo en cada carga de admin.xhtml (landing tras login),
                 sin persistencia de "ya mostrado". -->
            <p:dialog header="Aviso" widgetVar="dlgAlertaTimbresCert" modal="true" closable="true"
                      resizable="false" appendTo="@(body)" visible="#{facturarContoller.mostrarAlertaTimbresCert}">
                <h:panelGroup rendered="#{facturarContoller.mostrarAlertaTimbresCert}">
                    <ui:repeat value="#{facturarContoller.obtenerMensajesAlertaTimbresCert()}" var="mensajeAlerta">
                        <p>#{mensajeAlerta}</p>
                    </ui:repeat>
                </h:panelGroup>
            </p:dialog>
        </ui:define>

    </ui:composition>
</html>
